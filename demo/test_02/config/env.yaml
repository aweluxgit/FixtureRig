---
- pythonpath: ..

- fixture:
    name: "dummy"
    class: fixturerig.fixtures.dummy_fixture.DummyFixture

# Reports: every demo project writes into demo/reports/<project>/.
# parameterpath entries are relative to this file (demo/test_02/config/), so
# they work from any working directory.
# The console report is active by default and needs no entry.
- report:
    name: "json"
    class: fixturerig.report.json_report.JsonReport
    parameterpath:
      path: ../../reports/test_02/report.json
- report:
    name: "html"
    class: fixturerig.report.html.HtmlReport
    parameterpath:
      path: ../../reports/test_02/report.html
    parametermap:
      title: "Demo test_02"
- report:
    name: "pdf"
    class: fixturerig.report.pdf.PdfReport
    parameterpath:
      path: ../../reports/test_02/report.pdf
    parametermap:
      title: "Demo test_02"
- report:
    name: "test_spec"
    class: fixturerig.report.pdf.PdfTestSpecReport
    parameterpath:
      path: ../../reports/test_02/test_spec.pdf
    parametermap:
      title: "Demo test_02 - Test specification"
- report:
    name: "excel"
    class: fixturerig.report.excel.ExcelReport
    parameterpath:
      path: ../../reports/test_02/report.xlsx
- report:
    name: "allure"
    class: fixturerig.report.allure.AllureReport
    parameterpath:
      results_dir: ../../reports/test_02/allure-results
    parametermap:
      clean: true
