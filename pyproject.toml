[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fixturerig"
version = "0.1.0"
description = "Python-first, object-oriented test framework for hardware-in-the-loop (HIL) and physical-system testing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Werth" }]
requires-python = ">=3.10"
keywords = ["testing", "hil", "hardware-in-the-loop", "test-framework", "fixtures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]
fixtures = [
    "owon-psu>=0.0.6",
]
all = [
    "fixturerig[fixtures]",
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://github.com/aweluxgit/FixtureRig"
Source = "https://github.com/aweluxgit/FixtureRig"
Documentation = "https://aweluxgit.github.io/FixtureRig/"

[project.scripts]
fixturerig = "fixturerig.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixturerig = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fixturerig.config.model.TestCase / TestGroup are domain classes (named
# after the config schema's "testcase"/"testgroup" entries), not pytest test
# classes; silence the resulting, harmless collection warning.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
